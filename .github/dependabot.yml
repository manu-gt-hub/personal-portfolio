# Weekly pull requests for outdated or vulnerable dependencies and actions.
# The site has no runtime dependencies; npm covers the wrangler dev tool.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request a week for all actions instead of one per action
    groups:
      actions:
        patterns: ["*"]
